[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spacetime-sym"
dynamic = ["version"]
description = "A spacetime symmetry module"
readme = "README.md"
authors = [
    {name = "Dr. Bogdan M. Tanygin", email = "bogdan@deeptech.business"},
]
license = "GPL-3.0-only OR LicenseRef-Commercial"
license-files = ["LICENSE", "LICENSE-commercial", "licenses/bsym-MIT"]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "pytest-cov>=4.0",
]
docs = [
    # Sphinx 8.2/9 are supported by current PyData and MyST versions.
    "sphinx>=8.2,<10",
    "pydata-sphinx-theme>=0.23,<1",
    "myst-parser>=5,<6",
]

[project.urls]
"Homepage" = "https://github.com/bogdan-tanygin/spacetime-sym"
"Bug Tracker" = "https://github.com/bogdan-tanygin/spacetime-sym/issues"
"Source Code" = "https://github.com/bogdan-tanygin/spacetime-sym"

[tool.setuptools]
packages = ["spacetime"]

[tool.setuptools.dynamic]
version = {attr = "spacetime.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
]

[tool.coverage.run]
source = ["spacetime"]
omit = [
    "*/python?.?/*",
    "*/lib-python/?.?/*.py",
    "*/lib_pypy/_*.py",
    "*/site-packages/ordereddict.py",
    "*/site-packages/nose/*",
    "*/unittest2/*",
    "docs",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
